default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", 'localhost') %>
  username: <%= ENV.fetch("DB_USERNAME") %>
  password: <%= ENV.fetch("DB_PASSWORD") %>

development:
  <<: *default
  database: multi_tenant_ops_board_development

test:
  <<: *default
  database: multi_tenant_ops_board_test

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL", nil) %>
  cache:
    <<: *primary_production
    database: multi_tenant_ops_board_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: multi_tenant_ops_board_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: multi_tenant_ops_board_production_cable
    migrations_paths: db/cable_migrate
